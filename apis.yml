aid: autopass
name: Autopass
description: >-
  Autopass ("快速通") is a Taiwan-based mobility financial-services platform that connects
  service locations, car-owner apps, payments and benefits so that every driver enjoys a fast,
  convenient driving experience. Through its "powered by Autopass" service-authorization
  program, channel brand partners embed license-plate-based parking payment into their own
  car-owner apps: they register user license plates, surface partner parking locations (POIs)
  with live rates and hours, read in-progress parking sessions and completed orders, and receive
  entry/exit/billing/refund notifications over an OAuth 2.0 / OpenID Connect secured API. Autopass
  aims to become Asia's largest provider of mobility financial services. Backed by 500 Global.
